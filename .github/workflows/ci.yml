name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gat_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest websockets
      - name: 통합 테스트 (PostgreSQL + 실제 에이전트 코드 + 모의 장비)
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gat_test" }
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: 프론트엔드 빌드
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
