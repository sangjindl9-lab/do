# 로컬 개발·자체 호스팅용. 실행: docker compose up --build → http://localhost:8000
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gat }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  web:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gat
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 를 .env 에 설정하세요}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 를 .env 에 설정하세요}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes: [filedata:/data]
volumes: { dbdata: {}, filedata: {} }
